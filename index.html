<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instancy Issue Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f5;
  --surface:#ffffff;
  --surface2:#f3f3f0;
  --border:#e4e4e0;
  --border2:#d0d0cc;
  --text:#1a1a18;
  --text2:#6b6b66;
  --text3:#9b9b96;
  --accent:#2563eb;
  --accent-light:#eff6ff;
  --accent-border:#bfdbfe;
  --green:#16a34a;
  --green-light:#f0fdf4;
  --amber:#d97706;
  --amber-light:#fffbeb;
  --red:#dc2626;
  --red-light:#fef2f2;
  --purple:#7c3aed;
  --purple-light:#f5f3ff;
  --radius:8px;
  --radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}

/* ── Top bar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:15px;color:var(--text);letter-spacing:-.3px}
.logo span{color:var(--accent)}
.topbar-actions{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border)}
.btn-danger{border-color:#fca5a5;color:var(--red);background:#fff5f5}
.btn-danger:hover{background:var(--red-light);border-color:var(--red)}

/* ── Layout ── */
.app{display:flex;flex:1;overflow:hidden}

/* ── Left panel ── */
.panel-left{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-left-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-row{display:flex;gap:6px;margin-bottom:10px}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);outline:none;transition:border .15s}
.search-input:focus{border-color:var(--accent);background:#fff}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-row select{flex:1;min-width:90px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);outline:none;color:var(--text2)}
.issue-list{overflow-y:auto;flex:1}
.issue-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative}
.issue-item:hover{background:var(--surface2)}
.issue-item.active{background:var(--accent-light);border-left:3px solid var(--accent);padding-left:13px}
.issue-item-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.issue-item-title{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.4}
.issue-item-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.issue-item-date{font-size:11px;color:var(--text3)}
.issue-count{font-size:11px;color:var(--text3);padding:2px 6px;background:var(--surface2);border-radius:20px;border:1px solid var(--border)}
.empty-list{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}

/* ── Right panel ── */
.panel-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.no-issue{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3)}
.no-issue svg{opacity:.3}
.no-issue p{font-size:13px}

/* Issue detail */
.issue-detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;flex-shrink:0}
.detail-title-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.detail-title{font-size:18px;font-weight:600;line-height:1.3;flex:1}
.detail-title-input{font-size:18px;font-weight:600;width:100%;border:1px solid var(--accent);border-radius:var(--radius);padding:4px 8px;outline:none}
.detail-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta-group{display:flex;align-items:center;gap:5px}
.meta-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.meta-select{padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;font-size:12px;font-weight:500;cursor:pointer}
.meta-select:focus{border-color:var(--accent)}
.meta-text{font-size:12px;color:var(--text2)}

/* Ticket badge */
.ticket-badge{font-size:12px;font-weight:700;font-family:monospace;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:3px 8px;color:var(--text2);letter-spacing:.02em}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}

/* -- Priority badges -- */
.badge-critical{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.badge-high{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.badge-medium{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.badge-low{background:#dcfce7;color:#166534;border-color:#86efac}
.badge-request{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}

/* ── STATUS BADGES ──────────────────────────────────────────────
   To add a new status:
   1. Add the status string to the STATUSES array in the <script> below
   2. Add a .badge-[slug] class here  (slug = status lowercased, spaces→hyphens, / removed)
   3. Add the slug to the statusBadge() function's map object in the script
   ──────────────────────────────────────────────────────────── */
.badge-new{background:#f0f9ff;color:#0369a1;border-color:#7dd3fc}
.badge-open{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.badge-in-progress{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.badge-pending{background:#f3e8ff;color:#6d28d9;border-color:#d8b4fe}
.badge-on-hold{background:#f3f4f6;color:#374151;border-color:#d1d5db}
.badge-waiting-on-instancy{background:#fff7ed;color:#9a3412;border-color:#fdba74}
.badge-waiting-on-ph{background:#fdf4ff;color:#86198f;border-color:#f0abfc}
.badge-escalated{background:#fef9c3;color:#713f12;border-color:#fde047}
.badge-resolved{background:#dcfce7;color:#166534;border-color:#86efac}
.badge-closed{background:#f3f4f6;color:#6b7280;border-color:#d1d5db}
.badge-closed-without-resolution{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.badge-reopened{background:#fff1f2;color:#9f1239;border-color:#fda4af}
/* END STATUS BADGES */

/* Owner pill */
.owner-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.owner-instancy{background:#fff7ed;color:#9a3412;border-color:#fdba74}
.owner-ph{background:#fdf4ff;color:#86198f;border-color:#f0abfc}
.owner-both{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.owner-none{background:var(--surface2);color:var(--text3);border-color:var(--border)}

/* Next step bar */
.next-step-bar{background:#fffbeb;border-bottom:1px solid #fde68a;padding:10px 24px;flex-shrink:0}
.next-step-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#92400e;margin-bottom:4px}
.next-step-content{display:flex;align-items:center;gap:8px}
.next-step-text{flex:1;font-size:13px;color:var(--text);line-height:1.4}
.next-step-empty{color:var(--text3);font-style:italic}
.next-step-input{flex:1;padding:6px 10px;border:1px solid var(--accent);border-radius:var(--radius);outline:none;font-size:13px}

/* Timeline */
.timeline-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.timeline-entry{display:flex;gap:12px}
.tl-left{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tl-dot.instancy{background:#f97316;box-shadow:0 0 0 3px #fed7aa}
.tl-dot.ph{background:#a855f7;box-shadow:0 0 0 3px #e9d5ff}
.tl-dot.system{background:var(--border2);box-shadow:0 0 0 3px var(--border)}
.tl-dot.note{background:var(--accent);box-shadow:0 0 0 3px var(--accent-border)}
.tl-line{flex:1;width:1px;background:var(--border);margin-top:4px;min-height:8px}
.tl-body{flex:1;padding-bottom:4px}
.tl-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tl-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.tl-tag.instancy{background:#fff7ed;color:#9a3412}
.tl-tag.ph{background:#fdf4ff;color:#86198f}
.tl-tag.system{background:var(--surface2);color:var(--text3)}
.tl-when{font-size:11px;color:var(--text3)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.tl-card.instancy{border-left:3px solid #f97316}
.tl-card.ph{border-left:3px solid #a855f7}
.tl-card.system{border-left:3px solid var(--border2);background:var(--surface2)}
.tl-text{font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.tl-changes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tl-change{font-size:11px;padding:2px 8px;border-radius:4px;background:#f0f9ff;border:1px solid #bae6fd;color:#0369a1}

/* Log area */
.log-area{background:var(--surface);border-top:1px solid var(--border);padding:14px 24px;flex-shrink:0}
.log-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--border)}
.log-tab{padding:6px 16px;font-size:13px;font-weight:500;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.log-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.log-tab:hover{color:var(--text)}
.log-quick{display:flex;gap:8px;align-items:flex-end}
.log-quick textarea{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);resize:none;outline:none;height:56px;line-height:1.5;background:var(--surface);transition:border .15s}
.log-quick textarea:focus{border-color:var(--accent)}
.log-quick-right{display:flex;flex-direction:column;gap:6px}
.log-form{display:flex;flex-direction:column;gap:8px}
.form-row{display:flex;gap:8px}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.form-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);outline:none;background:var(--surface);transition:border .15s}
.form-input:focus{border-color:var(--accent)}
.form-textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);outline:none;resize:none;height:60px;line-height:1.5;background:var(--surface);transition:border .15s}
.form-textarea:focus{border-color:var(--accent)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px;width:540px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Help tip */
.help-tip{font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;margin-top:8px;line-height:1.5}



/* ── Collapsible timeline entries ── */
.tl-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:8px}
.tl-toggle:hover .tl-chevron{color:var(--text2)}
.tl-chevron{font-size:12px;color:var(--text3);transition:transform .18s;flex-shrink:0;line-height:1}
.tl-chevron.open{transform:rotate(180deg)}
.tl-preview{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;flex:1;margin-left:4px}
.tl-preview.hidden{display:none}
.tl-body-content{overflow:hidden;transition:max-height .2s ease}
.tl-body-content.collapsed{display:none}
.tl-collapse-all{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0 0 8px 0;display:block;margin-left:auto}
.tl-collapse-all:hover{color:var(--accent)}

/* ── Multi-select filter dropdowns ── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.ms-wrap{position:relative;flex:1;min-width:100px}
.ms-btn{width:100%;padding:6px 28px 6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text2);font-size:12px;font-family:inherit;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;appearance:none;-webkit-appearance:none}
.ms-btn:after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3);font-size:11px}
.ms-btn.has-selection{color:var(--text);border-color:var(--accent);background:var(--accent-light)}
.ms-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:180px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:200;padding:6px 0;max-height:280px;overflow-y:auto}
.ms-dropdown.open{display:block}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text);transition:background .1s}
.ms-item:hover{background:var(--surface2)}
.ms-item input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;cursor:pointer}
.ms-item label{cursor:pointer;flex:1;line-height:1.3}
.ms-divider{height:1px;background:var(--border);margin:4px 8px}
.ms-clear{width:100%;padding:5px 12px;font-size:11px;color:var(--text3);text-align:left;border:none;background:none;cursor:pointer;font-family:inherit}
.ms-clear:hover{color:var(--accent)}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Instancy <span>Issue Tracker</span></div>
    <span id="issue-count-badge" class="issue-count">0 issues</span>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" onclick="exportData()" title="Download all issues as JSON backup">⬇ Export</button>
    <button class="btn btn-ghost btn-sm" onclick="triggerImport()" title="Restore from JSON backup">⬆ Import</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-primary btn-sm" onclick="openNewIssue()">+ New Issue</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel-left">
    <div class="panel-left-header">
      <div class="search-row">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" id="search" placeholder="Search issues, tickets, notes…" oninput="renderList()">
        </div>
        <select id="sort-select" title="Sort order" onchange="window._currentSort=this.value;localStorage.setItem('elm_sort',this.value);renderList()" style="padding:7px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);outline:none;color:var(--text2);font-size:12px;cursor:pointer;flex-shrink:0">
          <option value="newest">Newest → Oldest</option>
          <option value="oldest">Oldest → Newest</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <div class="filter-row">
        <!-- STATUS multi-select -->
        <div class="ms-wrap" id="ms-status-wrap">
          <button class="ms-btn" id="ms-status-btn" onclick="toggleDropdown('ms-status-dd',event)">Status</button>
          <div class="ms-dropdown" id="ms-status-dd">
            <!-- ADD STATUS CHECKBOXES HERE (mirror the STATUSES array in script) -->
            <label class="ms-item"><input type="checkbox" value="New" onchange="renderList()"><label>New</label></label>
            <label class="ms-item"><input type="checkbox" value="Open" onchange="renderList()"><label>Open</label></label>
            <label class="ms-item"><input type="checkbox" value="In Progress" onchange="renderList()"><label>In Progress</label></label>
            <label class="ms-item"><input type="checkbox" value="Pending" onchange="renderList()"><label>Pending</label></label>
            <label class="ms-item"><input type="checkbox" value="On Hold" onchange="renderList()"><label>On Hold</label></label>
            <label class="ms-item"><input type="checkbox" value="Waiting on Instancy" onchange="renderList()"><label>Waiting on Instancy</label></label>
            <label class="ms-item"><input type="checkbox" value="Waiting on PH" onchange="renderList()"><label>Waiting on PH</label></label>
            <label class="ms-item"><input type="checkbox" value="Escalated" onchange="renderList()"><label>Escalated</label></label>
            <label class="ms-item"><input type="checkbox" value="Resolved" onchange="renderList()"><label>Resolved</label></label>
            <label class="ms-item"><input type="checkbox" value="Closed" onchange="renderList()"><label>Closed</label></label>
            <label class="ms-item"><input type="checkbox" value="Closed without Resolution" onchange="renderList()"><label>Closed without Resolution</label></label>
            <label class="ms-item"><input type="checkbox" value="Reopened" onchange="renderList()"><label>Reopened</label></label>
            <div class="ms-divider"></div>
            <button class="ms-clear" onclick="clearFilter('ms-status-dd');renderList()">Clear</button>
          </div>
        </div>
        <!-- PRIORITY multi-select -->
        <div class="ms-wrap" id="ms-priority-wrap">
          <button class="ms-btn" id="ms-priority-btn" onclick="toggleDropdown('ms-priority-dd',event)">Priority</button>
          <div class="ms-dropdown" id="ms-priority-dd">
            <!-- ADD PRIORITY CHECKBOXES HERE (mirror the PRIORITIES array in script) -->
            <label class="ms-item"><input type="checkbox" value="Critical/Urgent" onchange="renderList()"><label>Critical/Urgent</label></label>
            <label class="ms-item"><input type="checkbox" value="High" onchange="renderList()"><label>High</label></label>
            <label class="ms-item"><input type="checkbox" value="Medium" onchange="renderList()"><label>Medium</label></label>
            <label class="ms-item"><input type="checkbox" value="Low" onchange="renderList()"><label>Low</label></label>
            <label class="ms-item"><input type="checkbox" value="Request/Question" onchange="renderList()"><label>Request/Question</label></label>
            <div class="ms-divider"></div>
            <button class="ms-clear" onclick="clearFilter('ms-priority-dd');renderList()">Clear</button>
          </div>
        </div>
        <!-- OWNER multi-select -->
        <div class="ms-wrap" id="ms-owner-wrap">
          <button class="ms-btn" id="ms-owner-btn" onclick="toggleDropdown('ms-owner-dd',event)">Owner</button>
          <div class="ms-dropdown" id="ms-owner-dd">
            <!-- ADD OWNER CHECKBOXES HERE (mirror the OWNERS array in script) -->
            <label class="ms-item"><input type="checkbox" value="Instancy" onchange="renderList()"><label>Instancy</label></label>
            <label class="ms-item"><input type="checkbox" value="PH" onchange="renderList()"><label>PH</label></label>
            <label class="ms-item"><input type="checkbox" value="Both" onchange="renderList()"><label>Both</label></label>
            <label class="ms-item"><input type="checkbox" value="" onchange="renderList()"><label>Unassigned</label></label>
            <div class="ms-divider"></div>
            <button class="ms-clear" onclick="clearFilter('ms-owner-dd');renderList()">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="issue-list" id="issue-list"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel-right" id="panel-right">
    <div class="no-issue" id="no-issue">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/></svg>
      <p>Select an issue or press <kbd style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11px">N</kbd> to create one</p>
    </div>
    <div class="issue-detail" id="issue-detail" style="display:none"></div>
  </div>
</div>

<!-- NEW ISSUE MODAL -->
<div class="modal-overlay" id="new-modal" style="display:none" onclick="closeNewIfBg(event)">
  <div class="modal">
    <div class="modal-title">New Issue</div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="form-label">Title *</label>
      <input class="form-input" id="new-title" placeholder="Short description of the issue">
    </div>
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select class="form-input" id="new-priority">
          <!-- ADD PRIORITY OPTIONS HERE -->
          <option>High</option>
          <option>Critical/Urgent</option>
          <option>Medium</option>
          <option>Low</option>
          <option>Request/Question</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="new-status">
          <!-- ADD STATUS OPTIONS HERE -->
          <option>Open</option>
          <option>New</option>
          <option>In Progress</option>
          <option>Pending</option>
          <option>On Hold</option>
          <option>Waiting on Instancy</option>
          <option>Waiting on PH</option>
          <option>Escalated</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-bottom:10px">
      <div class="form-group">
        <label class="form-label">Responsible Party</label>
        <select class="form-input" id="new-owner">
          <!-- ADD RESPONSIBLE PARTY OPTIONS HERE -->
          <option value="Instancy">Instancy</option>
          <option value="PH">PH</option>
          <option value="Both">Both</option>
          <option value="">Unassigned</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Assigned To</label>
        <input class="form-input" id="new-assignee" placeholder="e.g. Mai, Jen, Nalini…">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="form-label">Next Step</label>
      <input class="form-input" id="new-nextstep" placeholder="What needs to happen next?">
    </div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="form-label">Initial Description / Note</label>
      <textarea class="form-textarea" id="new-desc" placeholder="Describe the issue…" style="height:80px"></textarea>
    </div>
    <div class="help-tip">💡 A ticket number (PH-XXXX) will be auto-assigned when you create the issue.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeNewModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createIssue()">Create Issue</button>
    </div>
  </div>
</div>

<script>
// ─── CONFIGURATION ────────────────────────────────────────────
// To add/edit a status: update STATUSES, add a badge class in <style>, add to statusBadge() map
// To add/edit a priority: update PRIORITIES, add a badge class in <style>, add to priorityBadge() map
// To add/edit responsible parties: update OWNERS
// To add/edit assignees: update ASSIGNEES (these are just suggestions; field is free-text)

const STATUSES = [
  'New',
  'Open',
  'In Progress',
  'Pending',
  'On Hold',
  'Waiting on Instancy',
  'Waiting on PH',
  'Escalated',
  'Resolved',
  'Closed',
  'Closed without Resolution',
  'Reopened'
];

const PRIORITIES = [
  'Critical/Urgent',
  'High',
  'Medium',
  'Low',
  'Request/Question'
];

const OWNERS = ['Instancy', 'PH', 'Both'];   // Responsible party options

const ASSIGNEES = ['Mai', 'Jen', 'Nalini'];   // Suggested assignees (free-text field, these are just datalist hints)

// ─── DATA LAYER ───────────────────────────────────────────────
const STORE_KEY = 'elm_tracker_v2';

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}

function save(issues) {
  localStorage.setItem(STORE_KEY, JSON.stringify(issues));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function nextTicket(issues) {
  // Find highest PH ticket number and increment
  let max = 0;
  issues.forEach(i => {
    if (i.ticket && i.ticket.startsWith('PH-')) {
      const n = parseInt(i.ticket.slice(3), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return 'PH-' + String(max + 1).padStart(4, '0');
}

function ts() { return new Date().toISOString(); }

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function fmtShort(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

let issues = load();

let activeId = null;
let activeLogTab = 'quick';

// ─── BADGE RENDERERS ──────────────────────────────────────────
// To add a new priority: add entry here + .badge-[slug] CSS class above
function priorityBadge(p) {
  const map = {
    'Critical/Urgent': 'badge-critical',
    'High':            'badge-high',
    'Medium':          'badge-medium',
    'Low':             'badge-low',
    'Request/Question':'badge-request'
  };
  return `<span class="badge ${map[p] || 'badge-medium'}">${p}</span>`;
}

// To add a new status: add entry here + .badge-[slug] CSS class above
// Slug rule: lowercase, spaces→hyphens, slashes removed, "without"→"without"
function statusBadge(s) {
  const map = {
    'New':                      'badge-new',
    'Open':                     'badge-open',
    'In Progress':               'badge-in-progress',
    'Pending':                  'badge-pending',
    'On Hold':                  'badge-on-hold',
    'Waiting on Instancy':      'badge-waiting-on-instancy',
    'Waiting on PH':            'badge-waiting-on-ph',
    'Escalated':                'badge-escalated',
    'Resolved':                 'badge-resolved',
    'Closed':                   'badge-closed',
    'Closed without Resolution':'badge-closed-without-resolution',
    'Reopened':                 'badge-reopened'
  };
  return `<span class="badge ${map[s] || 'badge-on-hold'}">${s}</span>`;
}

function ownerPill(o) {
  if (!o) return `<span class="owner-pill owner-none">Unassigned</span>`;
  const icons = { 'Instancy': '⚡', 'PH': '🏠', 'Both': '↔' };
  const cls   = { 'Instancy': 'owner-instancy', 'PH': 'owner-ph', 'Both': 'owner-both' };
  return `<span class="owner-pill ${cls[o] || 'owner-none'}">${icons[o] || ''} ${o}</span>`;
}

// ─── MULTI-SELECT FILTER HELPERS ─────────────────────────────
function getChecked(ddId) {
  return Array.from(document.querySelectorAll('#' + ddId + ' input[type=checkbox]:checked'))
    .map(cb => cb.value);
}

function toggleDropdown(ddId, e) {
  e.stopPropagation();
  const dd = document.getElementById(ddId);
  const isOpen = dd.classList.contains('open');
  // Close all
  document.querySelectorAll('.ms-dropdown').forEach(d => d.classList.remove('open'));
  if (!isOpen) dd.classList.add('open');
}

function clearFilter(ddId) {
  document.querySelectorAll('#' + ddId + ' input[type=checkbox]')
    .forEach(cb => cb.checked = false);
  updateBtnLabel(ddId);
}

function updateBtnLabel(ddId) {
  const checked = getChecked(ddId);
  const btnId = ddId.replace('-dd', '-btn');
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const names = { 'ms-status-dd': 'Status', 'ms-priority-dd': 'Priority', 'ms-owner-dd': 'Owner' };
  if (checked.length === 0) {
    btn.textContent = names[ddId] || 'Filter';
    btn.classList.remove('has-selection');
  } else {
    const label = checked.length === 1
      ? (checked[0] || 'Unassigned')
      : checked.length + ' selected';
    btn.textContent = label;
    btn.classList.add('has-selection');
  }
}

// Close dropdowns when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-dropdown').forEach(d => d.classList.remove('open'));
  }
});

// ─── ISSUE LIST ───────────────────────────────────────────────
function renderList() {
  const q   = document.getElementById('search').value.toLowerCase();
  const sf  = getChecked('ms-status-dd');
  const pf  = getChecked('ms-priority-dd');
  const of  = getChecked('ms-owner-dd');

  const filtered = issues.filter(i => {
    if (sf.length && !sf.includes(i.status)) return false;
    if (pf.length && !pf.includes(i.priority)) return false;
    if (of.length && !of.includes(i.owner)) return false;
    if (q) {
      const haystack = [i.title, i.ticket, i.nextStep, i.assignee,
        ...i.timeline.map(e => e.text)].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  const statusOrder = {
    'In Progress':0,'Open':1,'New':1,'Pending':2,
    'Waiting on Instancy':2,'Waiting on PH':2,'Escalated':2,
    'On Hold':3,'Reopened':3,'Resolved':4,'Closed':5,'Closed without Resolution':5
  };
  const _sort = window._currentSort || 'newest';
  if (_sort === 'az') {
    filtered.sort((a,b) => a.title.localeCompare(b.title));
  } else if (_sort === 'za') {
    filtered.sort((a,b) => b.title.localeCompare(a.title));
  } else if (_sort === 'oldest') {
    filtered.sort((a,b) => new Date(a.createdAt||a.updatedAt) - new Date(b.createdAt||b.updatedAt));
  } else {
    // newest (default) - also used as fallback
    filtered.sort((a,b) => new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt));
  }

  document.getElementById('issue-count-badge').textContent =
    `${filtered.length} issue${filtered.length !== 1 ? 's' : ''}`;
  updateBtnLabel('ms-status-dd');
  updateBtnLabel('ms-priority-dd');
  updateBtnLabel('ms-owner-dd');

  const el = document.getElementById('issue-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-list">No issues match your filters.</div>`;
    return;
  }

  el.innerHTML = filtered.map(i => {
    const last = i.timeline.length ? i.timeline[i.timeline.length - 1] : null;
    const assigneeStr = i.assignee ? ` · 👤 ${escHtml(i.assignee)}` : '';
    return `<div class="issue-item${i.id === activeId ? ' active' : ''}" onclick="openIssue('${i.id}')">
      <div class="issue-item-top">
        <span class="issue-item-title">${escHtml(i.title)}</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text3);flex-shrink:0">${i.ticket}</span>
      </div>
      <div class="issue-item-meta">
        ${priorityBadge(i.priority)}
        ${statusBadge(i.status)}
        ${i.owner ? ownerPill(i.owner) : ''}
      </div>
      <div class="issue-item-date">${last ? 'Updated ' + fmtShort(last.at) : 'Created ' + fmtShort(i.createdAt)}${assigneeStr}</div>
    </div>`;
  }).join('');
}

// ─── ISSUE DETAIL ─────────────────────────────────────────────
function openIssue(id) {
  activeId = id;
  renderList();
  renderDetail();
}

function getIssue() { return issues.find(i => i.id === activeId); }

function statusOptions(current) {
  return STATUSES.map(s => `<option${s === current ? ' selected' : ''}>${escHtml(s)}</option>`).join('');
}
function priorityOptions(current) {
  return PRIORITIES.map(p => `<option${p === current ? ' selected' : ''}>${escHtml(p)}</option>`).join('');
}
function ownerOptions(current) {
  return [...OWNERS, ''].map(o =>
    `<option value="${o}"${o === current ? ' selected' : ''}>${o || 'Unassigned'}</option>`).join('');
}

function renderDetail() {
  const issue = getIssue();
  if (!issue) {
    document.getElementById('no-issue').style.display = 'flex';
    document.getElementById('issue-detail').style.display = 'none';
    return;
  }
  document.getElementById('no-issue').style.display = 'none';
  document.getElementById('issue-detail').style.display = 'flex';

  document.getElementById('issue-detail').innerHTML = `
    <div class="detail-header">
      <div class="detail-title-row">
        <div class="detail-title" id="title-display" title="Double-click to edit">${escHtml(issue.title)}</div>
        <button class="btn btn-sm btn-ghost" onclick="editTitle()" title="Edit title">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deleteIssue('${issue.id}')">Delete</button>
      </div>
      <div class="detail-meta">
        <div class="meta-group">
          <span class="meta-label">Ticket</span>
          <span class="ticket-badge">${issue.ticket}</span>
        </div>
        <div class="meta-group">
          <span class="meta-label">Priority</span>
          <select class="meta-select" onchange="updateMeta('priority',this.value)">${priorityOptions(issue.priority)}</select>
        </div>
        <div class="meta-group">
          <span class="meta-label">Status</span>
          <select class="meta-select" onchange="updateMeta('status',this.value)">${statusOptions(issue.status)}</select>
        </div>
        <div class="meta-group">
          <span class="meta-label">Responsible</span>
          <select class="meta-select" onchange="updateMeta('owner',this.value)">${ownerOptions(issue.owner)}</select>
        </div>
        <div class="meta-group">
          <span class="meta-label">Assigned To</span>
          <input list="assignee-suggestions" class="meta-select" id="assignee-field"
            value="${escHtml(issue.assignee || '')}"
            placeholder="—"
            style="width:100px"
            onchange="updateMeta('assignee',this.value)"
            onblur="updateMeta('assignee',this.value)">
          <datalist id="assignee-suggestions">
            ${ASSIGNEES.map(a => `<option value="${a}">`).join('')}
          </datalist>
        </div>
        <div class="meta-group">
          <span class="meta-label">Opened</span>
          <span class="meta-text">${fmt(issue.createdAt)}</span>
        </div>
      </div>
    </div>

    <div class="next-step-bar">
      <div class="next-step-label">⟶ Next Step</div>
      <div class="next-step-content" id="ns-view">
        <div class="next-step-text${!issue.nextStep ? ' next-step-empty' : ''}"
          id="ns-text">${issue.nextStep ? escHtml(issue.nextStep) : 'No next step — click Edit to add one'}</div>
        <button class="btn btn-sm btn-ghost" onclick="editNextStep()">Edit</button>
      </div>
      <div id="ns-edit" style="display:none">
        <input class="next-step-input" id="ns-input" value="${escHtml(issue.nextStep || '')}"
          placeholder="What needs to happen next?">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-sm btn-primary" onclick="saveNextStep()">Save</button>
          <button class="btn btn-sm" onclick="cancelNextStep()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="timeline-area" id="timeline-area">
      ${renderTimeline(issue)}
    </div>

    <div class="log-area">
      <div class="log-tabs">
        <button class="log-tab${activeLogTab==='quick'?' active':''}" onclick="switchTab('quick')">Quick Note</button>
        <button class="log-tab${activeLogTab==='form'?' active':''}" onclick="switchTab('form')">Log Update</button>
      </div>
      ${activeLogTab === 'quick' ? `
      <div class="log-quick">
        <textarea id="quick-text" placeholder="Type a note and press Log… (Ctrl+Enter to submit)" onpaste="handleImagePaste(event)"></textarea>
        <div id="paste-preview" class="paste-preview" style="display:none;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:6px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)"></div>
        <div class="log-quick-right">
          <select class="form-input" id="quick-from" style="width:120px">
            <option value="ph">PH</option>
            <option value="instancy">Instancy</option>
            <option value="system">System</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="logQuick()">Log →</button>
        </div>
      </div>` : `
      <div class="log-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">From</label>
            <select class="form-input" id="form-from">
              <option value="ph">PH</option>
              <option value="instancy">Instancy</option>
              <option value="system">System</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Change Status to</label>
            <select class="form-input" id="form-status">
              <option value="">— no change —</option>
              ${statusOptions('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Reassign to</label>
            <select class="form-input" id="form-owner">
              <option value="">— no change —</option>
              ${OWNERS.map(o=>`<option>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Update Next Step</label>
            <input class="form-input" id="form-nextstep" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label class="form-label">Reassign To (person)</label>
            <input list="assignee-suggestions2" class="form-input" id="form-assignee" placeholder="Leave blank to keep current">
            <datalist id="assignee-suggestions2">${ASSIGNEES.map(a=>`<option value="${a}">`).join('')}</datalist>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Communication / Notes *</label>
          <textarea class="form-textarea" id="form-text"
            placeholder="Summarize what was communicated, decided, or actioned…"></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <button class="btn btn-primary btn-sm" onclick="logForm()">Log Update →</button>
        </div>
      </div>`}
    </div>
  `;

  const qt = document.getElementById('quick-text');
  if (qt) {
    qt.addEventListener('keydown', e => { if (e.key==='Enter'&&(e.ctrlKey||e.metaKey)) logQuick(); });
    qt.addEventListener('paste', handleImagePaste);
  }
  const ft = document.getElementById('form-text');
  if (ft) ft.addEventListener('paste', handleImagePaste);
  scrollTimeline();
}

function renderTimeline(issue) {
  if (!issue.timeline.length) {
    return `<div style="text-align:center;padding:40px 20px;color:var(--text3);font-size:13px">
      No communications logged yet.<br>Use the panel below to add the first entry.
    </div>`;
  }

  // Most recent entry always expanded; older entries collapsed by default
  const total = issue.timeline.length;
  const header = total > 1
    ? `<div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:4px">
        <button class="tl-collapse-all" onclick="tlCollapseAll(true)" title="Collapse all entries">Collapse all</button>
        <button class="tl-collapse-all" style="margin-left:12px" onclick="tlCollapseAll(false)" title="Expand all entries">Expand all</button>
       </div>`
    : '';

  const entries = issue.timeline.map((entry, idx) => {
    const isLast = idx === total - 1;
    const type = entry.type || 'system';
    const tagLabel = type === 'instancy' ? 'Instancy' : type === 'ph' ? 'PH' : 'System';
    // Newest entry (isLast) starts expanded; all others start collapsed
    const collapsed = !isLast;
    const entryId = 'tl-entry-' + idx;
    // Preview: first non-empty line, truncated
    const preview = (entry.text || '').split('\n').find(l => l.trim()) || '';

    return `<div class="timeline-entry" id="${entryId}">
      <div class="tl-left">
        <div class="tl-dot ${type}"></div>
        ${!isLast ? '<div class="tl-line"></div>' : ''}
      </div>
      <div class="tl-body">
        <div class="tl-toggle" onclick="tlToggle('${entryId}')">
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
            <span class="tl-tag ${type}">${tagLabel}</span>
            <span class="tl-when">${fmt(entry.at)}</span>
            <span class="tl-preview${collapsed ? '' : ' hidden'}">${escHtml(preview.slice(0, 80))}${preview.length > 80 ? '…' : ''}</span>
          </div>
          <span class="tl-chevron${collapsed ? '' : ' open'}">▾</span>
        </div>
        <div class="tl-body-content${collapsed ? ' collapsed' : ''}">
          <div class="tl-card ${type}" style="margin-top:6px" data-entry-id="${entry.id}">
            <button class="tl-edit-btn" data-iid="${issue.id}" data-eid="${entry.id}" style="float:right;margin:-2px 0 4px 8px;padding:2px 9px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text2);cursor:pointer;opacity:0.7">Edit</button>
          <div class="tl-text">${escHtml(entry.text)}</div>
            ${(entry.images||[]).length
              ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${entry.images.map(src=>`<img src="${src}" style="max-width:100%;max-height:320px;border-radius:6px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${src}','_blank')" title="Click to open full size">`).join('')}</div>`
              : ''}
            ${(entry.changes||[]).length
              ? `<div class="tl-changes">${entry.changes.map(c=>`<span class="tl-change">${escHtml(c)}</span>`).join('')}</div>`
              : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return header + entries;
}

function tlToggle(entryId) {
  const el = document.getElementById(entryId);
  if (!el) return;
  const content = el.querySelector('.tl-body-content');
  const chevron = el.querySelector('.tl-chevron');
  const preview = el.querySelector('.tl-preview');
  const collapsed = content.classList.contains('collapsed');
  content.classList.toggle('collapsed', !collapsed);
  chevron.classList.toggle('open', !collapsed);
  preview && preview.classList.toggle('hidden', !collapsed);
}

function tlCollapseAll(collapse) {
  document.querySelectorAll('.tl-body-content').forEach(c => {
    c.classList.toggle('collapsed', collapse);
  });
  document.querySelectorAll('.tl-chevron').forEach(ch => {
    ch.classList.toggle('open', !collapse);
  });
  document.querySelectorAll('.tl-preview').forEach(p => {
    p.classList.toggle('hidden', !collapse);
  });
}

function scrollTimeline() {
  const el = document.getElementById('timeline-area');
  if (el) setTimeout(() => el.scrollTop = el.scrollHeight, 50);
}

// ─── IMAGE PASTE SUPPORT ─────────────────────────────────────
// Pasted images are stored here until the entry is logged
let pendingImages = [];

function handleImagePaste(e) {
  const items = (e.clipboardData || e.originalEvent?.clipboardData || {}).items;
  if (!items) return;
  let foundImage = false;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      foundImage = true;
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => {
        pendingImages.push(ev.target.result);
        showPastePreview();
      };
      reader.readAsDataURL(blob);
    }
  }
  // If no image found, let normal text paste proceed
}

function showPastePreview() {
  let preview = document.getElementById('paste-preview');
  if (!preview) {
    // Insert preview area between textarea and button row
    const logArea = document.querySelector('.log-quick, .log-form');
    if (!logArea) return;
    preview = document.createElement('div');
    preview.id = 'paste-preview';
    preview.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center';
    logArea.appendChild(preview);
  }
  preview.innerHTML = pendingImages.map((src, i) =>
    `<div style="position:relative;display:inline-block">
      <img src="${src}" style="height:56px;border-radius:6px;border:1px solid var(--border);object-fit:cover">
      <button onclick="removePendingImage(${i})" style="position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>`
  ).join('') + (pendingImages.length ? `<span style="font-size:11px;color:var(--text3)">${pendingImages.length} image${pendingImages.length>1?'s':''} attached</span>` : '');
}

function removePendingImage(idx) {
  pendingImages.splice(idx, 1);
  showPastePreview();
}

function clearPendingImages() {
  pendingImages = [];
  const preview = document.getElementById('paste-preview');
  if (preview) preview.innerHTML = '';
}

// ─── MUTATIONS ────────────────────────────────────────────────
function updateMeta(field, value) {
  const issue = getIssue();
  if (!issue) return;
  const old = issue[field];
  if (old === value) return;
  issue[field] = value;
  issue.updatedAt = ts();
  const labels = { priority:'Priority', status:'Status', owner:'Responsible party', assignee:'Assigned to' };
  issue.timeline.push({
    id: uid(), type: 'system', at: ts(),
    text: `${labels[field]||field} changed: "${old||'—'}" → "${value||'—'}"`,
    changes: []
  });
  save(issues);
  renderList();
  renderDetail();
}

function editTitle() {
  const issue = getIssue();
  if (!issue) return;
  const d = document.getElementById('title-display');
  if (!d) return;
  const inp = document.createElement('input');
  inp.className = 'detail-title-input';
  inp.value = issue.title;
  d.replaceWith(inp);
  inp.focus(); inp.select();
  inp.addEventListener('blur', () => saveTitle(inp.value));
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter') inp.blur();
    if (e.key==='Escape') { inp.value = issue.title; inp.blur(); }
  });
}

function saveTitle(val) {
  const issue = getIssue();
  if (!issue || !val.trim()) { renderDetail(); return; }
  if (val.trim() === issue.title) { renderDetail(); return; }
  issue.title = val.trim();
  issue.updatedAt = ts();
  save(issues);
  renderList();
  renderDetail();
}

function editNextStep() {
  document.getElementById('ns-view').style.display = 'none';
  document.getElementById('ns-edit').style.display = 'block';
  document.getElementById('ns-input').focus();
}

function cancelNextStep() {
  document.getElementById('ns-view').style.display = 'flex';
  document.getElementById('ns-edit').style.display = 'none';
}

function saveNextStep() {
  const issue = getIssue();
  if (!issue) return;
  const val = document.getElementById('ns-input').value.trim();
  const old = issue.nextStep;
  if (val === old) { cancelNextStep(); return; }
  issue.nextStep = val;
  issue.updatedAt = ts();
  issue.timeline.push({
    id: uid(), type: 'system', at: ts(),
    text: `Next step updated: "${val || '(cleared)'}"`, changes: []
  });
  save(issues);
  renderList();
  renderDetail();

function logQuick() {
  const issue = getIssue();
  if (!issue) return;
  const text = (document.getElementById('quick-text').value || '').trim();
  const from = document.getElementById('quick-from').value;
  if (!text && !pendingImages.length) return;
  const entry = { id: uid(), type: from, at: ts(), text: text || '(image attached)', changes: [] };
  if (pendingImages.length) entry.images = [...pendingImages];
  issue.timeline.push(entry);
  issue.updatedAt = ts();
  clearPendingImages();
  save(issues);
  renderList();
  renderDetail();
}

function logForm() {
  const issue = getIssue();
  if (!issue) return;
  const text = (document.getElementById('form-text').value || '').trim();
  if (!text) { alert('Please enter communication notes.'); return; }

  const from      = document.getElementById('form-from').value;
  const newStatus = document.getElementById('form-status').value;
  const newOwner  = document.getElementById('form-owner').value;
  const newNS     = (document.getElementById('form-nextstep').value || '').trim();
  const newAssign = (document.getElementById('form-assignee').value || '').trim();
  const changes   = [];

  if (newStatus && newStatus !== issue.status) {
    changes.push(`Status: ${issue.status} → ${newStatus}`);
    issue.status = newStatus;
  }
  if (newOwner && newOwner !== issue.owner) {
    changes.push(`Responsible: ${issue.owner||'Unassigned'} → ${newOwner}`);
    issue.owner = newOwner;
  }
  if (newNS && newNS !== issue.nextStep) {
    changes.push(`Next step updated`);
    issue.nextStep = newNS;
  }
  if (newAssign && newAssign !== issue.assignee) {
    changes.push(`Assigned to: ${issue.assignee||'—'} → ${newAssign}`);
    issue.assignee = newAssign;
  }

  const newEntry = { id: uid(), type: from, at: ts(), text, changes };
  if (pendingImages.length) newEntry.images = [...pendingImages];
  clearPendingImages();
  issue.timeline.push(newEntry);
  issue.updatedAt = ts();
  save(issues);
  renderList();
  renderDetail();
}

function switchTab(tab) {
  activeLogTab = tab;
  renderDetail();
}

// ─── NEW ISSUE ────────────────────────────────────────────────
function openNewIssue() {
  document.getElementById('new-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('new-title').focus(), 50);
}

function closeNewModal() {
  document.getElementById('new-modal').style.display = 'none';
  ['new-title','new-ticket','new-nextstep','new-desc','new-assignee'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
}

function closeNewIfBg(e) {
  if (e.target === document.getElementById('new-modal')) closeNewModal();
}

function createIssue() {
  const title = (document.getElementById('new-title').value || '').trim();
  if (!title) { alert('Please enter a title.'); return; }
  const now     = ts();
  const ticket  = nextTicket(issues);
  const desc    = (document.getElementById('new-desc').value || '').trim();
  const issue   = {
    id:        uid(),
    ticket,
    title,
    priority:  document.getElementById('new-priority').value,
    status:    document.getElementById('new-status').value,
    owner:     document.getElementById('new-owner').value,
    assignee:  (document.getElementById('new-assignee').value || '').trim(),
    nextStep:  (document.getElementById('new-nextstep').value || '').trim(),
    createdAt: now,
    updatedAt: now,
    timeline:  []
  };
  issue.timeline.push({
    id: uid(), type: 'system', at: now,
    text: desc ? `Issue created.\n\n${desc}` : 'Issue created.',
    changes: []
  });
  issues.unshift(issue);
  save(issues);
  closeNewModal();
  openIssue(issue.id);
}

function deleteIssue(id) {
  if (!confirm('Permanently delete this issue? This cannot be undone.')) return;
  issues = issues.filter(i => i.id !== id);
  activeId = null;
  save(issues);
  renderList();
  document.getElementById('no-issue').style.display = 'flex';
  document.getElementById('issue-detail').style.display = 'none';
}

// ─── IMPORT / EXPORT ─────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(issues, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `elm-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function triggerImport() { document.getElementById('import-file').click(); }

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Not an array');
      if (!confirm(`Import ${imported.length} issues? Duplicates (same ticket #) will be skipped.`)) return;
      const existingTickets = new Set(issues.map(i => i.ticket));
      const newOnes = imported.filter(i => !existingTickets.has(i.ticket));
      issues = [...issues, ...newOnes];
      save(issues);
      renderList();
      alert(`Imported ${newOnes.length} new issues. ${imported.length - newOnes.length} duplicates skipped.`);
    } catch { alert('Could not read file. Make sure it is a valid eLM Tracker JSON export.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─── UTILS ───────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'n' || e.key === 'N') openNewIssue();
  if (e.key === 'Escape') closeNewModal();
});

imeline":[{"id":"b8ukly1guu","type":"system","at":"2025-06-24T00:00:00+00:00","text":"Issue logged.\n\nTraining object preview in content library showing title of original object that it was copied from; updated metadata and was advised to do so by Instancy but not working.","changes":[]},{"id":"dmuxwvkhzd","type":"ph","at":"2025-06-24T00:00:00+00:00","text":"7/3/2025 on hold currently since it is not impacting learners on front-end.","changes":[]}]},{"id":"gicq0vnr25","ticket":"PH-0016","title":"Reviewer Role - requesting details on how this role works","priority":"Request/Question","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-28T00:00:00+00:00","updatedAt":"2025-07-28T00:00:00+00:00","timeline":[{"id":"i545ez8eqg","type":"system","at":"2025-07-28T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\n9:23\u202fAM (0 minutes ago)\nto support, Jennifer\n\nHi Instancy,\n\nWhere can I find information on how the Reviewer role works?  At face value, it appears anyone with this permission can review content but not edit.  We'd like to have several of our billing team members review billing content and if it's possible for them to do so without adding it to their My Learning and without giving them Author permission to access the Content Library, that would be ideal. \n\nThanks, \n\n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com","changes":[]},{"id":"dpk72uio9k","type":"ph","at":"2025-07-28T00:00:00+00:00","text":"7/29/2025 - Reviewer role is a feature tied to learning modules where they can leave comments for a team collaboration.  Nalini will check with team about enhancing user guides with this or similar feature. \n\n7/31/2025 - they've got this on their list of enhancement so for the time being, use Author for SMEs to review.","changes":[]}]},{"id":"cu17cjfvpc","ticket":"PH-0017","title":"Manager Designation","priority":"Request/Question","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-08-12T00:00:00+00:00","updatedAt":"2025-08-12T00:00:00+00:00","timeline":[{"id":"5emrrorv1s","type":"system","at":"2025-08-12T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\n1:13\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHello Instancy, \n\nOf the information that comes over from the EHR, what does the eLM use to identify a manager and their employees?  For example, since I am Jennifer (Hassa's) manager, when our information initially comes in, how does the eLM know that 1) I'm a manager and 2) Jennifer should be in MyGroup?  \n\nAnother example - if a registered nurse is also a manager with five staff reporting to her but she is not designated as a manager in the EHR (just an RN), how does she receive the manager role in the eLM and have her five staff appear in MyGroup? \n\nThanks, \n\n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com","changes":[]},{"id":"wfydupu64a","type":"ph","at":"2025-08-12T00:00:00+00:00","text":"8/14/2025 - Nalini will send a response\n\n8/19/2025 - there's an \"evaluator\" dropdown in User Profile that is manually updated which is the learner's manager.  Nalini will work to enable this and in the future, we can look at how to automate it with the data feed.\n\n8/25/2025 - Nalini advised that the Manager permission and Group Admin permission/roles may conflict.  Offered alternative: instead of turning on Manager which corresponds to the Evaluator dropdown in the user profile, give Managers the Group Admin permission/role and they can create a child group under the Organization group and assign their staff to it.  Confirmed with Nalini that Move is a permanent group change whereas Assign Group places users in multiple groups.  Asked how assigned groups will be impacted by data coming from EHR since we know it will move learners back to their Parent org when you MOVE them.  Will Assign Group be reverted too?  Jen will test.","changes":[]}]},{"id":"pr9o59x2cs","ticket":"PH-0018","title":"Questions without Correct Answers","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"e2uldpv9b7","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\n12:54\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHi Instancy,\n\nA few weeks ago, we ran into a user guide issue where the correct answers were selected for knowledge check questions and saved but were not maintained.  We've been notified of several by learners, but is Instancy able to run a report or query in some way to identify knowledge check questions for which a correct answer hasn't been selected?  This will be extremely helpful in correcting them.  \n\n We don't want to have to edit every user guide that was created around the time of the problem because of the need to re-publish and re-generate.  \n\nThank you, \n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com","changes":[]},{"id":"7unnuqe9zu","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"8/14/2025 - Instancy is trying to reproduce and Mai will send recording if available. \n\n8/15/2025 weekend - Mai sent recording; feature is working correctly with some instances of sporadic changes.  Instancy still troubleshooting.  \n\n8/21/2025 - as a workaround, Nalini suggested not using the AI generated questions i.e. do  not edit and use them as they are not maintaining correct answers without additional work.  Advised to try creating question from scratch with Add New Question.  I advised I have been doing that but it's not reliable and will still lose the correct answers on occasions.  I'll record and send a video when that happens.  \n\n9/2/2025 - follow up with Nalini on next call \n\n9/9/2025 - platform issue that they are still working on. \n\n10/29/2025 - they are continuing to investigate why this is; they have provided several workarounds and we continue to be careful when building to ensure all questions and answers are carrying through.","changes":[]}]},{"id":"fsst47vxnx","ticket":"PH-0019","title":"Badge or Code to show certification/completion on social link","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-08-19T00:00:00+00:00","updatedAt":"2025-08-19T00:00:00+00:00","timeline":[{"id":"7hkv7byhb6","type":"system","at":"2025-08-19T00:00:00+00:00","text":"Issue logged.\n\nFrom Marketing: does platform provide code to paste/embed training completion, certification, badge to social media.\n\nMai Lyter <mai@patagoniahealth.com>\n1:01\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHi Support,\n\nWe discussed this possibility with Nalini earlier and I didn't not explain it clearly.  This video should clarify what our marketing team is asking about.  Please let me know what questions you have.  Thanks!  \n\nHow to Add a Badge to LinkedIn\n\n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com","changes":[]},{"id":"i8coolo10k","type":"ph","at":"2025-08-19T00:00:00+00:00","text":"8/19/2025 - sent example video to Instancy Support \n\n8/21/2025 - this is not an available feature. They will send a statement of work.","changes":[]}]},{"id":"s4dwa90c93","ticket":"PH-0020","title":"Continuing Education Unit","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-08-19T00:00:00+00:00","updatedAt":"2025-08-19T00:00:00+00:00","timeline":[{"id":"9a5oh4aly5","type":"system","at":"2025-08-19T00:00:00+00:00","text":"Issue logged.\n\nPlace to record continuing education units","changes":[]},{"id":"l3sa4t5426","type":"ph","at":"2025-08-19T00:00:00+00:00","text":"8/19/2025 - Nalini will check with team about enhancing eLearnings with this feature since it's available in Calendar. \n\n8/19/2025 follow up email to Instancy; no email notifiations received by either Mai or Jen. \n\nMai Lyter <mai@patagoniahealth.com>\n6:02\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHi Support,\n\nNalini assisted in enabling the email notification to system administrators when learners submitted feedback via the Feedback tab on their My Learning Plus.  Jen and I both logged into learner accounts and submitted feedback today 8/19/2025 between 11:30 am and 1 pm and neither of us have received any notifications to our mai@patagoniahealth.com or jennifer@patagoniahealth.com.  Nothing in our spam boxes either.  Can someone review to ensure we're using it correctly and/or the system is configured correctly?   \n\nThanks, \n--\n\n\t\nMai Lyter \nLearning Management Manager","changes":[]}]},{"id":"mnymxv5iww","ticket":"PH-0021","title":"Trying to Bulk Assign Component Not Working","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-09-02T00:00:00+00:00","updatedAt":"2025-09-02T00:00:00+00:00","timeline":[{"id":"jc4kayls1c","type":"system","at":"2025-09-02T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\n3:30\u202fPM (2 hours ago)\nto support\n\nHi Support,\n\nI was attempting to bulk assign our user guides to the Catalog Video component to remedy a previously reported issue.  \n\nI went to my folder in Content and selected all the guides before choosing the three dot Action button in the upper right and Assign.  Nothing comes up though.  Am I missing a step or a set-up somewhere?\nimage.png\nThanks!\n\nStep:\n1.  Go to my folder (Mai)\n2.  Select all user guides with first column (checkboxes).  \n3.  This activates the three dot Actions menu in the top right.  Select this and Assign.\n4.  Nothing happens.  The other Assign options appear correctly though","changes":[]},{"id":"12intb8pcv","type":"ph","at":"2025-09-02T00:00:00+00:00","text":"9/9/2025 - Nalini explains this use to work as described but they changed it.  I didn't fully understand her explanation so she said she'd find some documentation to shaer that might better explain.","changes":[]}]},{"id":"61tma0e3f8","ticket":"PH-0022","title":"Enhancement to Certificate Assignment","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-09-02T00:00:00+00:00","updatedAt":"2025-09-02T00:00:00+00:00","timeline":[{"id":"pvyfsk8dvw","type":"system","at":"2025-09-02T00:00:00+00:00","text":"Issue logged.\n\nWhen a certificate is assigned to a UG/VT, it displays the title of the training.  However, if the title is updated in the UG/VT or Metadata, it is not updated on the cert.  Thinking about this in regard to Phoenix when we have to update all of our v2 content from title with Billing to Phoenix.","changes":[]},{"id":"dah5ewd8oa","type":"ph","at":"2025-09-02T00:00:00+00:00","text":"9/9/2025 - ran out of time; did not ask Nalini.","changes":[]}]},{"id":"hadfueh9ip","ticket":"PH-0023","title":"Assign Groups (not to be confused with Move Group)","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-09-17T00:00:00+00:00","updatedAt":"2025-09-17T00:00:00+00:00","timeline":[{"id":"1atjr52i34","type":"system","at":"2025-09-17T00:00:00+00:00","text":"Issue logged.\n\n9/17/2025 - There is an Assign Groups feature which suggests to us that learners can be part of multiple groups.  When utilizing the Move Group feature, that's a permanent change from one organization/site/group to another.  However, Assign Groups is adding them to another group for a different reason i.e. a group of just nurses, a group of just employes hired after X date at an organization, etc.  However, the Assign Groups window is not activated to actually test.  Discuss this with Nalini a few weeks back and she was able to see it occur firsthand.  Just following up for an update.","changes":[]},{"id":"evfbn86pti","type":"ph","at":"2025-09-17T00:00:00+00:00","text":"9/23/2025 - send Nalini email with details on how we'd like to use Assign Groups. \n\n9/23/2025 - provided details:\n\nMai Lyter <mai@patagoniahealth.com>\n1:12\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHi Instancy,\n\nWe briefly discussed this with Nalini, and she requested details for clarification.\n\nWe have a need to identify and manage groups of learners within an organization where membership is not based on role, job category, registration date, training status, or other standard criteria. In many cases, there is no defined pattern for who belongs in the group, but the ability to group these learners remains both necessary and highly beneficial.\n\nAt first, we thought the Assign Group feature could meet this need, but after our conversation with Nalini, it seems the functionality may not align with our initial expectations. Below are a few real-world examples that highlight how flexible group assignment would be valuable for our clients (and for us as administrators).\n\nExample 1 \u2013 Billing\u2026\n[See original spreadsheet for full history]","changes":[]}]},{"id":"dtduk9jjv5","ticket":"PH-0024","title":"Can we filter out Images from areas like Catalog and Workflows?","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"x91l4folu9","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nIn areas like Users --> Assign Content, Catalog, Workflows, etc, can images be automatically filtered out?  Because there are so many, it makes it challenging to search for needed training objects.","changes":[]},{"id":"l9yskrusx0","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"9/25/25 - Nalini will discuss with team.","changes":[]}]},{"id":"82uwgs4f02","ticket":"PH-0025","title":"Ability to deactivate retired content","priority":"Request/Question","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"8w85v1n13b","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nPrevents them from populating in searches when assigning content, setting up workflows, running reports, etc.","changes":[]},{"id":"mk3iucq1z7","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"10/7/2025 - Instancy requested list of TOs to disable; this is done on the back-end. \n10/14/2025 - when a training object is disabled, how does that appear on a learner's end i.e. Desktop?  Follow-up with Nalini next chance possible. \n\n10/21/2025 - will discuss with Srinivas and Harvey","changes":[]}]},{"id":"bh3qvi9y65","ticket":"PH-0026","title":"Red/Green outlines on wrong/right answers","priority":"Low","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"4x5xwgak8o","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nRequesting another way to identify the right/wrong answers; received feedback the outlines are disruptive and congestive.","changes":[]},{"id":"1v5luwzi3s","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"10/7/2025 - Nalini is going to test different options in staging and present her findings for us to select an alternative.","changes":[]}]},{"id":"1th5brf0sg","ticket":"PH-0027","title":"Reports > Session Abandoned and hundreds of hours of logged in time","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"gpgbggoc5l","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nUpdate Reports to show Timed Out with legitimate duration instead of Session Abandoned and hundreds of hours","changes":[]},{"id":"sf2fclp8du","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"10/7/2025 - have not asked about this yet.","changes":[]}]},{"id":"ar76cxs33h","ticket":"PH-0028","title":"Quick Guide Bookmark or Favorite","priority":"Request/Question","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"pkyi6cjoin","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\nAttachments\n9:47\u202fAM (0 minutes ago)\nto support, Jennifer\n\nHi Instancy,\n\nPlease see the attached recording.  Our new VP of CET (my new boss) made the following suggestion so I'm forwarding it to see what the chances are of implementing a bookmark or favorite option for Quick Guides.  I'm aware of the Wishlist but that has the ability to Add to My Desktop which we don't want learners to do with quick guides.  \n\nLet me know what questions there are.  Thanks!\n\n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com\n\nlinkedin icon youtube icon twitter icon facebook icon\n\n10x Stevie Award Winner\nSales & Customer Service","changes":[]},{"id":"6z3vxk00jm","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"11/4/2025 - Nalini will discuss with team and Harvey\n\n11/6/2025 - will discuss with team","changes":[]}]},{"id":"7jlo8fc07k","ticket":"PH-0029","title":"Content Type Renaming","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"","createdAt":"2025-06-11T00:00:00+00:00","updatedAt":"2025-06-11T00:00:00+00:00","timeline":[{"id":"aeiqencgac","type":"system","at":"2025-06-11T00:00:00+00:00","text":"Issue logged.\n\nQuick Guides = User Guide (HTML) - hide these altogether\nVideo Tutorial = prefer Video Tutorials if possible.  If not, hide User Guide (HTML) and User Guide (Video) is fine. \nWebinars = videos.  Change to Webinars\nLearning Paths = Learning Paths is fine.\nInteractive Video = Video is fine","changes":[]},{"id":"wbk923yn9t","type":"ph","at":"2025-06-11T00:00:00+00:00","text":"10/30/2025 - Nalini is mocking this up in staging and will let us know when it's ready to review/approve/review\n\n11/4/2025 - cannot rename User Guide (Video) to Video Tutorials.  Therefore, she will hide User Guide (HTML) and we will keep User Guide (Video) on the video tutorials.  Webinars have been corrected and Learning Paths are good.  Will close when User Guide (HTML) is hidden\n\n11/6/2025 - all but webinars is complete.","changes":[]}]},{"id":"o9np8tbqxs","ticket":"PH-0030","title":"Learning Module AI Generated Content.  Azure V. Claude","priority":"High","status":"On Hold","owner":"","assignee":"","nextStep":"5/21/2026 - paused for now.  Simulation tool is not ready for us to enable AI to use it. \n\n5/5/2026 - Mai followed up with Ben to follow up with Harbi re: internal hesitance to make connections. \n\n4/15/2026 - Instancy sent details needed from our end to set up content generation with images on our end (AI).  Forward to Ben and Curtis. \n\n3/31//2026 - Instancy is cross-verifying with simulation extension and LM to ensure compabitility between Claude, Azure, and the various tools/application.  Will wait for updates.  \n\n3/23/2026 - Nalini indicated during today's call she would respond soon; we can continue to test the simulation extension. \n\n3/17/2026 - Mai followed up with Instancy; waiting response\n\n3/17/2026 - Mai tested extension and AI generations working; Mai will reach out to Harbi for necessary information to enable remaining AI configurations for LM build\n\n3/3/2026 - Instancy indicates simulation outputs are ready for further testing.  Mai will test. \n\n2/10/26 - Instancy will demo simulation extension on Thursday 2/12\n\n1/22/26 - Claude used for Simulation generation.  It will be enabled for PH when they're ready for us to test.  We will test and when ready, take it to Harvey and team so they can provide the necessary Azure information to Instancy. \n2/3/26 - Instancy in 25 - requested this to be enabled in production.","changes":[]}]},{"id":"e4218pzb9b","ticket":"PH-0051","title":"Due Date = #DaysFromLaunch","priority":"Medium","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-08T00:00:00+00:00","updatedAt":"2025-07-08T00:00:00+00:00","timeline":[{"id":"msillmdrf9","type":"system","at":"2025-07-08T00:00:00+00:00","text":"Issue logged.\n\nDoes this mean the training will be due X days from when the user initially accesses training?","changes":[]}]},{"id":"hsdm3ijeps","ticket":"PH-0052","title":"Request: Remove Questions Pop-Up on VT","priority":"Request/Question","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-09T00:00:00+00:00","updatedAt":"2025-07-09T00:00:00+00:00","timeline":[{"id":"8m27skvl61","type":"system","at":"2025-07-09T00:00:00+00:00","text":"Issue logged.\n\nPlease see the attached recording.  We would like to use the user guides and video tutorial to communicate release notes.  As such, there will be no questions.  Would it be possible to eliminate the questions window from populating at the end of the VT if no questions are built into the UG?  Thanks!","changes":[]},{"id":"u2xudus2yq","type":"ph","at":"2025-07-09T00:00:00+00:00","text":"7/10/2025 - sent Nalini the names and GUID of the VT that need this pop-up removed.\n\n7/11/2025 - specified TO had questions removed.","changes":[]}]},{"id":"a3zgvb0m0o","ticket":"PH-0053","title":"Update Account Settings Label","priority":"Low","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-09T00:00:00+00:00","updatedAt":"2025-07-09T00:00:00+00:00","timeline":[{"id":"c0fkiotb6o","type":"system","at":"2025-07-09T00:00:00+00:00","text":"Issue logged.\n\nCan the label in Account Settings be updated to User ID or Login ID instead of the current Email?  Thanks!","changes":[]},{"id":"r4719qzjzq","type":"ph","at":"2025-07-09T00:00:00+00:00","text":"7/10/2025 - discussed during weekly meeting; Nali nt between blocks.  \n\n7/22/2025 - corrected please test.\n\n7/24/2025 - tested.  Confirm not experiencing issues with dragging to reorder items in LP","changes":[]}]},{"id":"15sjvnb9kz","ticket":"PH-0057","title":"Using Blur feature","priority":"Medium","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-10T00:00:00+00:00","updatedAt":"2025-07-10T00:00:00+00:00","timeline":[{"id":"3a4ve0yskg","type":"system","at":"2025-07-10T00:00:00+00:00","text":"Issue logged.\n\nRequested demonstration of using blur feature in the \"advanced image editor\" i.e. from an image in the content library, choose actions and edit.  This editor provides more option than the editor within the UG.","changes":[]},{"id":"kuvkyjg6kt","type":"ph","at":"2025-07-10T00:00:00+00:00","text":"7/10/2025 - Nalini will record a demo and send it later. \n\n7/15/2025 - spoke with Nalini during weekly call; they are still investigating it's functionality and she will send a recording on how to use it as soon as possible (hopefully by tomorrow).\n\n7/17/2025 - the editor is a TUI Image Editor and it doesn't support selected region blurring.  Nalini demonstrated how to crop the area that needed to be blur and use that to mask original image.  Will test internally. \n\n7/22/2025 - if trainers are in need of blur, will demonstrate masking feature in eLM with the advanced image editor, but will strongly encourage them to make the edits i.e. blurs prior to uploading image into Instancy.","changes":[]}]},{"id":"vmmvt4403l","ticket":"PH-0058","title":"My Group data/report not displaying","priority":"High","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-07-10T00:00:00+00:00","updatedAt":"2025-07-10T00:00:00+00:00","timeline":[{"id":"ik42fk0gu4","type":"system","at":"2025-07-10T00:00:00+00:00","text":"Issue logged.\n\n7/10/2025 discussed during weekly meeting with Nalini and demonstrated that data was not coming over to My Group for managers.","changes":[]},
