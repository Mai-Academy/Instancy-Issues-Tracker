dAt":"2025-07-29T00:00:00+00:00","timeline":[{"id":"kwakphs072","type":"system","at":"2025-07-29T00:00:00+00:00","text":"Issue logged.\n\n7/29/2025 - demonstrated on call with Nalini with Patient Referral Order Widget UG.  Image A shows on a step.  When you go into edit the image, Image B from the previous step appears.  If you save in the Image Editor, it maintains Image B.  If you cancel out of Image Editor, it maintains Image A.  This shift/misalignment impacts subsequent images.  Only way to fix is to remove the problem image, manually capture and insert image, but this isn't a permanent fix because there's a chance down the line with same UG that it happens again.","changes":[]},{"id":"yzrff2jikk","type":"ph","at":"2025-07-29T00:00:00+00:00","text":"7/29/2025 - made copy of problem UG for Nalini and team to investigate. \n\n7/30/2025 - received email update they are still investigating.  Requested additional examples if possible and confirmed with Instancy this was occurring while using the extension. \n\n7/31/2025 - same as yesterday.\n\n8/21/2025 - Nalini advised they are still working on this.  I also updated her that we have advised our people to not build guides greater than 50 steps to 1) prevent misaligned images and 2) no one will watch a 10 minute video which is the length of a 50 step guide. \n\n9/2/2025 - Instancy expecting this to be corrected with new extension that should be coming out in the next day or two.  \n\n9/9/2025 - should be resolved with extension received first week of September.  Will need to test.  \n\n9/23/2025 - tested this with the 117 step UG that was captured with Chrome Extension.  Not able to duplicate thus far but also not taking real-life actions i.e. starting at the beginning, updating text, updating imag\u2026\n[See original spreadsheet for full history]","changes":[]}]},{"id":"vkz4gpesh4","ticket":"PH-0074","title":"Duplicate Webinars (My Reports)","priority":"High","status":"Resolved","owner":"","assignee":"","nextStep": applied.  Tested this scenario though and the static video is still showing when a VT is being regenerated.  It is supposed to show the old version until the new one is done generating.\n\n10/3/2025 - team has corrected; Nalini is testing and will notify me when it's ready for me to test. \n\n10/7/2025 - Jen tested and appears to be working correctly.","changes":[]}]},{"id":"dgsxdbc751","ticket":"PH-0091","title":"Can one of the options to close a webinar be removed?","priority":"High","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-09-02T00:00:00+00:00","updatedAt":"2025-09-02T00:00:00+00:00","timeline":[{"id":"2icwtavx3c","type":"system","at":"2025-09-02T00:00:00+00:00","text":"Issue logged.\n\nRight now, when viewing a webinar, learners have the option to Complete Video Later and Save and Exit.  Both work but can we eliminate one to prevent confusion? \n\nEmail sent: Mai Lyter <mai@patagoniahealth.com>\n7:02\u202fPM (0 minutes ago)\nto support, Jennifer\n\nHi Instancy,\n\nWe've received this feedback and request two or three times now, and I wanted to see what our options were.\n\nWhen viewing webinars, they all have the options to Complete Video Later and Save & Exit.  Both work as expected, but learners are hesitant to select one over the other in case it loses their place.  We as authors and admins know it doesn't, but they don't and can't quickly ask someone, so it's a fear that's been reported.  \nimage.png\n\nSecondly, if a learner chooses Complete Video Later, it walks them through two sub\u2026\n[Full description in original spreadsheet]","changes":[]},{"id":"0eqzo3m6qm","type":"ph","at":"2025-09-02T00:00:00+00:00","text":"9/9/2025 - explained confusion between the two to Nalini.  She explained the Complete Video later remembers where users left off where Save&Exit does not.  Asked if she could check to see what the possibilities are of having the system remember where users left off with the Save&Exit button only.  The ulitmate goal is to have just one button that will remember where to resume.  Please provide options.   \n\n9/11/2025 - still reviewing with team to provide options.\n\n9/17/2025 - relayed to Nalini my preference i.e. the green Save & Exit should serve both purposes of resuming where learner left off as well as the ability to mark training completed (when applicable) and give learners completion credit; Nalini will revisit this with Team and provide options. \n\n9/25/2025 - for all webinar related change request, provide a list for them to activate their Camtasia license again and changes will be made together.","changes":[]}]},{"id":"h9vb8rw51a","ticket":"PH-0092","title":"Required/not required knowledge check questions","priority":"Request/Question","status":"Resolved","owner":"","assignee":"","nextStep":"","createdAt":"2025-09-03T00:00:00+00:00","updatedAt":"2025-09-03T00:00:00+00:00","timeline":[{"id":"25jq0svnap","type":"system","at":"2025-09-03T00:00:00+00:00","text":"Issue logged.\n\nMai Lyter <mai@patagoniahealth.com>\n4:38\u202fPM (1 minute ago)\nto support, Jennifer\n\nHi Instancy,\n\nOur pilot clients asked about the possibility of making the knowledge check questions on the video tutorials required but not graded.\n\nCould an option similar to the Show Quiz be added?  Or what options are available?  Thank you!\nimage.png\n\n--\n\n\t\nMai Lyter \nLearning Management Manager\n (919) 338-2071\n mai@patagoniahealth.com\n patagoniahealth.com\n\nlinkedin icon youtube icon twitter icon facebook icon\n\n10x Stevie Award Winner\nSales & Customer Service","changes":[]},{"id":"j437bxfzmo","type":"ph","at":"2025-09-03T00:00:00+00:00","text":"9/9/2025 - discussed with Nalini and I sent email follow up with details. \n\n9/11/2025 - Nalini indicated she will speak with Harvey but advised to hold off on this; I am going to recommended to Adams county to leave these as not required.  But in the event they want questions to be required, they should use the assessment feature wh // ─── SORT STATE ──────────────────────────────────────────────
window._currentSort = localStorage.getItem('elm_sort') || 'newest';

// ─── TIMELINE ENTRY EDITING ───────────────────────────────────
function editEntry(issueId, entryId) {
  const card = document.querySelector('[data-entry-id="' + entryId + '"]');
  if (!card) return;
  const textEl = card.querySelector('.tl-text');
  if (!textEl || card.querySelector('.entry-edit-wrap')) return;
  const current = textEl.textContent;
  textEl.style.display = 'none';
  const ta = document.createElement('textarea');
  ta.value = current;
  ta.style.cssText = 'width:100%;min-height:100px;padding:8px;border:1px solid var(--accent);border-radius:var(--radius);font-size:13px;line-height:1.6;font-family:inherit;resize:vertical;outline:none;margin-bottom:4px';
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:6px;justify-content:flex-end;margin-top:4px';
  btnRow.innerHTML = '<button onclick="cancelEditEntry(\''+entryId+'\')" style="padding:4px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:12px">Cancel</button>' +
    '<button onclick="saveEntry(\''+issueId+'\',\''+entryId+'\',this)" style="padding:4px 12px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-size:12px">Save</button>';
  const wrap = document.createElement('div');
  wrap.className = 'entry-edit-wrap';
  wrap.appendChild(ta);
  wrap.appendChild(btnRow);
  textEl.insertAdjacentElement('afterend', wrap);
  ta.focus();
}

function cancelEditEntry(entryId) {
  const card = document.querySelector('[data-entry-id="' + entryId + '"]');
  if (!card) return;
  const textEl = card.querySelector('.tl-text');
  const wrap = card.querySelector('.entry-edit-wrap');
  if (textEl) textEl.style.display = '';
  if (wrap) wrap.remove();
}

function saveEntry(issueId, entryId) {
  const card = document.querySelector('[data-entry-id="' + entryId + '"]');
  if (!card) return;
  const wrap = card.querySelector('.entry-edit-wrap');
  const ta = wrap ? wrap.querySelector('textarea') : null;
  if (!ta) return;
  const newText = ta.value.trim();
  if (!newText) return;
  const issues = load();
  const issue = issues.find(i => i.id === issueId);
  if (!issue) return;
  const entry = issue.timeline.find(e => e.id === entryId);
  if (!entry) return;
  entry.text = newText;
  entry.editedAt = new Date().toISOString();
  save(issues);
  const textEl = card.querySelector('.tl-text');
  if (textEl) { textEl.textContent = newText; textEl.style.display = ''; }
  if (!card.querySelector('.tl-edited')) {
    const badge = document.createElement('span');
    badge.className = 'tl-edited';
    badge.textContent = ' (edited)';
    badge.style.cssText = 'font-size:10px;color:var(--text3)';
    const when = card.querySelector('.tl-when');
    if (when) when.appendChild(badge);
  }
  if (wrap) wrap.remove();
}

renderList();
document.addEventListener('click', function(e) {
  var btn = e.target.closest ? e.target.closest('.tl-edit-btn') : (e.target.classList.contains('tl-edit-btn') ? e.target : null);
  if (btn) { e.stopPropagation(); editEntry(btn.getAttribute('data-iid'), btn.getAttribute('data-eid')); }
});
document.addEventListener('mouseover', function(e) {
  if (e.target.classList && e.target.classList.contains('tl-edit-btn')) {
    e.target.style.opacity='1'; e.target.style.borderColor='var(--accent)'; e.target.style.color='var(--accent)';
  }
});
document.addEventListener('mouseout', function(e) {
  if (e.target.classList && e.target.classList.contains('tl-edit-btn')) {
    e.target.style.opacity='0.7'; e.target.style.borderColor='var(--border)'; e.target.style.color='var(--text2)';
  }
});
(function(){ var s=document.getElementById('sort-select'); if(s) s.value=window._currentSort; })();

</script>
